name: Optimize Fiorino images

on:
  push:
    branches:
      - site-v1
    paths:
      - .github/workflows/optimize-fiorino-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install --no-save sharp@0.33.5

      - name: Generate WebP assets
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const assets = [
            ['assets/images/frota/picapes/kl-fiorino-utilitario-principal.png', 'assets/images/frota/picapes/kl-fiorino-utilitario-principal.webp', 1280, 82],
            ['assets/images/frota/picapes/kl-fiorino-capacidade-carga.png', 'assets/images/frota/picapes/kl-fiorino-capacidade-carga.webp', 1100, 84]
          ];

          Promise.all(assets.map(async ([input, output, width, quality]) => {
            await sharp(input)
              .rotate()
              .resize({ width, withoutEnlargement: true })
              .webp({ quality, effort: 6 })
              .toFile(output);
            console.log(`${output}: ${(fs.statSync(output).size / 1024).toFixed(1)} KB`);
          })).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/frota/picapes/kl-fiorino-utilitario-principal.webp assets/images/frota/picapes/kl-fiorino-capacidade-carga.webp
          if git diff --cached --quiet; then
            echo "No optimized assets changed."
            exit 0
          fi
          git commit -m "perf: otimiza imagens da Fiorino em WebP"
          git push origin HEAD:site-v1
