name: Atualizar endereço oficial K.L

on:
  push:
    branches: [site-v1]
    paths:
      - '.github/workflows/ot-update-address.yml'

permissions:
  contents: write

jobs:
  update-address:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site-v1
        uses: actions/checkout@v4
        with:
          ref: site-v1
          fetch-depth: 0

      - name: Atualizar endereço no HTML e dados estruturados
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_schema = '''    "address": {
              "@type": "PostalAddress",
              "addressLocality": "Campinas",
              "addressRegion": "SP",
              "addressCountry": "BR"
            },'''
          new_schema = '''    "address": {
              "@type": "PostalAddress",
              "streetAddress": "R. Dr. Gastão da Rocha Leão, 683",
              "addressLocality": "Campinas",
              "addressRegion": "SP",
              "postalCode": "13050-400",
              "addressCountry": "BR"
            },'''

          if old_schema not in text:
              raise SystemExit('Bloco de endereço estruturado esperado não foi encontrado')
          text = text.replace(old_schema, new_schema, 1)

          old_footer = '<span>Bonfim · Campinas-SP</span>'
          new_footer = '<span>R. Dr. Gastão da Rocha Leão, 683 · Cidade Jardim · Campinas-SP · CEP 13050-400</span>'
          if old_footer not in text:
              raise SystemExit('Endereço antigo do rodapé não foi encontrado')
          text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remover workflow temporário
        run: rm .github/workflows/ot-update-address.yml

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ot-update-address.yml
          git commit -m "feat: inclui endereço oficial da K.L"
          git push origin site-v1