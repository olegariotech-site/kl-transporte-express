name: Optimize site images

on:
  push:
    branches:
      - site-v1
    paths:
      - .github/workflows/optimize-critical-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install --no-save sharp@0.33.5

      - name: Generate optimized WebP assets
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const assets = [
            ['assets/images/branding/kl-transporte-express-logo.png', 'assets/images/branding/kl-transporte-express-logo.webp', 320, 90],
            ['assets/images/frota/caminhoes/kl-caminhao-estrada-arvores.png', 'assets/images/frota/caminhoes/kl-caminhao-estrada-arvores.webp', 1280, 80],
            ['assets/images/frota/motos/kl-moto-frete-fazer.png', 'assets/images/frota/motos/kl-moto-frete-fazer.webp', 640, 80],
            ['assets/images/frota/kl-van-frente.png', 'assets/images/frota/kl-van-frente.webp', 720, 82],
            ['assets/images/frota/motos/kl-motoboy-express.png', 'assets/images/frota/motos/kl-motoboy-express.webp', 800, 82],
            ['assets/images/frota/picapes/kl-picapes-utilitarios-operacao.png', 'assets/images/frota/picapes/kl-picapes-utilitarios-operacao.webp', 1100, 88],
            ['assets/images/frota/caminhoes/kl-caminhao-carga-andaimes.png', 'assets/images/frota/caminhoes/kl-caminhao-carga-andaimes.webp', 1200, 82],
            ['assets/images/frota/caminhoes/kl-caminhao-estrutura-metalica-noturna.png', 'assets/images/frota/caminhoes/kl-caminhao-estrutura-metalica-noturna.webp', 1200, 82],
            ['assets/images/frota/caminhoes/kl-caminhao-carga-lona-noturna.png', 'assets/images/frota/caminhoes/kl-caminhao-carga-lona-noturna.webp', 1200, 82],
            ['assets/images/frota/caminhoes/kl-caminhao-galpao-industrial.png', 'assets/images/frota/caminhoes/kl-caminhao-galpao-industrial.webp', 1200, 82],
            ['assets/images/frota/caminhoes/kl-caminhao-container.png', 'assets/images/frota/caminhoes/kl-caminhao-container.webp', 1200, 82],
            ['assets/images/frota/motos/kl-frota-motos-operacao.png', 'assets/images/frota/motos/kl-frota-motos-operacao.webp', 1100, 88],
            ['assets/images/frota/kl-van-traseira.png', 'assets/images/frota/kl-van-traseira.webp', 720, 82],
            ['assets/images/frota/caminhoes/kl-caminhao-carregamento-concluido.png', 'assets/images/frota/caminhoes/kl-caminhao-carregamento-concluido.webp', 1200, 82]
          ];

          Promise.all(assets.map(async ([input, output, width, quality]) => {
            if (!fs.existsSync(input)) throw new Error(`Missing source: ${input}`);
            fs.mkdirSync(path.dirname(output), { recursive: true });
            await sharp(input)
              .rotate()
              .resize({ width, withoutEnlargement: true })
              .webp({ quality, effort: 6 })
              .toFile(output);
            const bytes = fs.statSync(output).size;
            console.log(`${output}: ${(bytes / 1024).toFixed(1)} KB`);
          })).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Point site images to WebP
        run: |
          sed -i \
            -e 's#assets/images/branding/kl-transporte-express-logo.png#assets/images/branding/kl-transporte-express-logo.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-estrada-arvores.png#assets/images/frota/caminhoes/kl-caminhao-estrada-arvores.webp#g' \
            -e 's#assets/images/frota/motos/kl-moto-frete-fazer.png#assets/images/frota/motos/kl-moto-frete-fazer.webp#g' \
            -e 's#assets/images/frota/kl-van-frente.png#assets/images/frota/kl-van-frente.webp#g' \
            -e 's#assets/images/frota/motos/kl-motoboy-express.png#assets/images/frota/motos/kl-motoboy-express.webp#g' \
            -e 's#assets/images/frota/picapes/kl-picapes-utilitarios-operacao.png#assets/images/frota/picapes/kl-picapes-utilitarios-operacao.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-carga-andaimes.png#assets/images/frota/caminhoes/kl-caminhao-carga-andaimes.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-estrutura-metalica-noturna.png#assets/images/frota/caminhoes/kl-caminhao-estrutura-metalica-noturna.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-carga-lona-noturna.png#assets/images/frota/caminhoes/kl-caminhao-carga-lona-noturna.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-galpao-industrial.png#assets/images/frota/caminhoes/kl-caminhao-galpao-industrial.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-container.png#assets/images/frota/caminhoes/kl-caminhao-container.webp#g' \
            -e 's#assets/images/frota/motos/kl-frota-motos-operacao.png#assets/images/frota/motos/kl-frota-motos-operacao.webp#g' \
            -e 's#assets/images/frota/kl-van-traseira.png#assets/images/frota/kl-van-traseira.webp#g' \
            -e 's#assets/images/frota/caminhoes/kl-caminhao-carregamento-concluido.png#assets/images/frota/caminhoes/kl-caminhao-carregamento-concluido.webp#g' \
            index.html

      - name: Commit optimized assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/images/**/*.webp assets/images/**/**/*.webp assets/images/**/**/**/*.webp
          if git diff --cached --quiet; then
            echo "No optimized assets or references changed."
            exit 0
          fi
          git commit -m "perf: use WebP assets across V2"
          git push origin HEAD:site-v1
