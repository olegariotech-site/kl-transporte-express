name: Apply Kaue priority adjustments

on:
  push:
    branches:
      - site-v1
    paths:
      - .github/workflows/apply-kaue-priority-adjustments.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install --no-save sharp@0.33.5

      - name: Optimize Fiorino images
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const assets = [
            ['assets/images/frota/picapes/kl-fiorino-utilitario-principal.png', 'assets/images/frota/picapes/kl-fiorino-utilitario-principal.webp', 1280, 82],
            ['assets/images/frota/picapes/kl-fiorino-capacidade-carga.png', 'assets/images/frota/picapes/kl-fiorino-capacidade-carga.webp', 1100, 84]
          ];
          Promise.all(assets.map(async ([input, output, width, quality]) => {
            if (!fs.existsSync(input)) throw new Error(`Missing source: ${input}`);
            await sharp(input).rotate().resize({ width, withoutEnlargement: true }).webp({ quality, effort: 6 }).toFile(output);
            console.log(`${output}: ${(fs.statSync(output).size / 1024).toFixed(1)} KB`);
          })).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Apply site adjustments
        run: python3 tools/apply-kaue-adjustments.py

      - name: Validate changes
        run: |
          grep -q "Moto Frete e Fiorino para resolver rápido" index.html
          grep -q "kl-fiorino-utilitario-principal.webp" index.html
          grep -q "kl-fiorino-capacidade-carga.webp" index.html
          grep -q 'id="servicos-diretos"' index.html
          grep -q "Fiorino / Utilitário" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/images/frota/picapes/kl-fiorino-utilitario-principal.webp assets/images/frota/picapes/kl-fiorino-capacidade-carga.webp
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: prioriza Moto Frete, Fiorino e Furgão na home"
          git push origin HEAD:site-v1
